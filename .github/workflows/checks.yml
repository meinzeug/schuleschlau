name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  operations:
    name: operations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'
      - run: python -m pip install -r backend/requirements-dev.lock
      - name: Check offsite, restore, monitoring and release staging
        run: >-
          python -m pytest -q scripts/tests/test_offsite_pacing.py
          scripts/tests/test_offsite_retention.py
          scripts/tests/test_journal_snapshot.py scripts/tests/test_watch_public.py
          scripts/tests/test_backup_storage.py scripts/tests/test_backup_retention.py scripts/tests/test_restore_monitor.py
          scripts/tests/test_stage_release.py scripts/tests/test_release_timestamp.py scripts/tests/test_postgres_ci_results.py
          scripts/tests/test_extract_gradle_runtime.py scripts/tests/test_audit_maven_osv.py
  backend:
    name: backend-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: ruff check backend deploy scripts
      - name: Run complete backend partition
        run: python scripts/run_backend_shard.py --shard-index ${{ matrix.shard }} --shard-count 3 --receipt artifacts/backend-shard-${{ matrix.shard }}.json -- -q
      - name: Record collection and partition
        if: always()
        run: cat artifacts/backend-shard-${{ matrix.shard }}.json
  postgres_concurrency:
    name: postgres-concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'
      - run: python -m pip install -r backend/requirements-dev.lock
      - name: Exercise isolated PostgreSQL 16 locks and idempotency
        run: >-
          python scripts/test_postgres.py
          backend/tests/test_admin_user_races.py
          backend/tests/test_providers.py::test_parallel_family_budget_atomic
          backend/tests/test_notification_inbox.py::test_two_devices_acknowledge_one_event_once
          backend/tests/test_grade_pdf_imports.py::test_parallel_confirm_and_parallel_repeat_upload_do_not_duplicate
          backend/tests/test_grade_pdf_imports.py::test_parallel_preview_upload_rechecks_idempotency_after_unlocked_parsing
          backend/tests/test_recall_planning_journey.py
          --junitxml="${{ runner.temp }}/postgres-concurrency.xml"
      - name: Reject skipped or incomplete PostgreSQL checks
        run: python scripts/check_postgres_ci_results.py "${{ runner.temp }}/postgres-concurrency.xml"
  flutter_tests:
    name: flutter-test-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    outputs:
      receipt_0: ${{ steps.partition.outputs.receipt_0 }}
      receipt_1: ${{ steps.partition.outputs.receipt_1 }}
      receipt_2: ${{ steps.partition.outputs.receipt_2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'
      - name: Install pinned official Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/schulpilot-flutter"
          test "$(git -C "$RUNNER_TEMP/schulpilot-flutter" rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/schulpilot-flutter/bin" >> "$GITHUB_PATH"
      - working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Run complete Flutter file partition
        id: partition
        run: python scripts/run_flutter_shard.py run --shard-index ${{ matrix.shard }} --shard-count 3 --receipt artifacts/flutter-shard-${{ matrix.shard }}.json
  flutter_static:
    name: flutter-analyze-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned official Flutter SDK
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/schulpilot-flutter"
          test "$(git -C "$RUNNER_TEMP/schulpilot-flutter" rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/schulpilot-flutter/bin" >> "$GITHUB_PATH"
      - working-directory: app
        run: flutter pub get --enforce-lockfile
      - working-directory: app
        run: flutter analyze --no-pub
      - working-directory: app
        run: flutter build web --release --no-pub --no-web-resources-cdn --csp
  flutter:
    name: flutter
    needs: [flutter_tests, flutter_static]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'
      - name: Check runner contracts without Flutter or app imports
        run: python -m unittest discover -s scripts/tests -p test_flutter_ci_sharding.py
      - name: Require all source-bound partitions and static checks
        env:
          FLUTTER_RECEIPT_0: ${{ needs.flutter_tests.outputs.receipt_0 }}
          FLUTTER_RECEIPT_1: ${{ needs.flutter_tests.outputs.receipt_1 }}
          FLUTTER_RECEIPT_2: ${{ needs.flutter_tests.outputs.receipt_2 }}
          FLUTTER_TEST_JOB_RESULT: ${{ needs.flutter_tests.result }}
          FLUTTER_STATIC_JOB_RESULT: ${{ needs.flutter_static.result }}
        run: python scripts/run_flutter_shard.py verify --from-env --require-job-results --receipt artifacts/flutter-union.json
